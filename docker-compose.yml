services:

  backend:
    container_name: task-manager-backend
    build: 
      context: ./backend
    ports:
      - "5002:5002"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app:cached
    restart: unless-stopped

  frontend:
    container_name: task-manager-frontend
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    restart: unless-stopped
  
